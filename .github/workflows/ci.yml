name: CI

# Jusqu'ici rien ne vérifiait le code avant un déploiement : Vercel construisait,
# et c'était tout. C'est ce qui a permis à une configuration Biome invalide de
# passer inaperçue et de neutraliser le linter du dépôt entier.
#
# typecheck bloque — c'est le garde-fou que CLAUDE.md déclare déjà obligatoire
# (« zero errors required ») et il ne demande ni secret ni service.
# lint est informatif : il remonte 695 diagnostics accumulés pendant qu'il était
# hors service. Le passer bloquant maintenant mettrait la CI au rouge en
# permanence ; il le deviendra quand la dette sera épongée.

on:
  push:
    branches: [main]
  pull_request:

# Une poussée rapprochée annule la précédente : inutile de valider un commit
# déjà dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci plutôt que npm install : installation reproductible depuis le
      # package-lock.json, et échec si le lock diverge du package.json.
      - name: Installer les dépendances
        run: npm ci

      # tsc --noEmit n'exécute aucun code et ne lit aucune variable
      # d'environnement : il tourne tel quel, sans secret.
      - name: Typecheck
        run: npm run typecheck

      - name: Isolation et reprise des traitements (PostgreSQL local)
        run: npm run test:hardening

      - name: Contrôles de sécurité
        run: npm run security:check -- --static

      - name: Build de production sans envoi externe
        run: npm run build
        env:
          FAITIERE_LOCAL_VERIFY: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      # Deux choses distinctes, traitées différemment :
      #
      #  • des diagnostics de lint → informatif. On les compte et on les écrit
      #    dans le résumé du job, visible sur la page de l'exécution. Un simple
      #    continue-on-error afficherait du vert et la dette resterait invisible.
      #
      #  • une configuration Biome invalide → bloquant. C'est précisément la
      #    panne qui a neutralisé le linter du dépôt sans que personne ne s'en
      #    aperçoive : Biome refuse alors de s'exécuter et ne rapporte aucun
      #    diagnostic. Un décompte à zéro ne doit jamais pouvoir signifier
      #    « le linter est cassé ».
      - name: Lint (informatif, config bloquante)
        run: |
          npx biome lint . --max-diagnostics=2000 > lint.log 2>&1 || true

          if grep -q 'configuration resulted in errors' lint.log; then
            echo "::error::Configuration Biome invalide — le lint ne s'exécute pas."
            cat lint.log
            exit 1
          fi

          count=$(grep -cE ':[0-9]+:[0-9]+ lint/' lint.log || true)
          count=${count:-0}

          {
            printf '## Lint — %s diagnostic(s)\n\n' "$count"
            if [ "$count" -gt 0 ]; then
              printf 'Non bloquant. Dette accumulée pendant que la configuration Biome était invalide.\n\n'
              printf '| Règle | Occurrences |\n|---|---:|\n'
              grep -oE 'lint/[a-z]+/[a-zA-Z]+' lint.log \
                | sort | uniq -c | sort -rn | head -10 \
                | awk '{ printf "| `%s` | %s |\n", $2, $1 }'
            else
              printf 'Aucun diagnostic — le lint peut devenir bloquant.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
