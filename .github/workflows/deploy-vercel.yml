name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        id: trigger
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo "response=$RESPONSE"
          JOB_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['job']['id'])" 2>/dev/null || echo "")
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          if [ -z "$JOB_ID" ]; then
            echo "❌ Failed to trigger deploy hook or parse job ID"
            exit 1
          fi
          echo "✅ Deploy triggered — job: $JOB_ID"

      - name: Wait for Vercel build to complete
        run: |
          JOB_ID="${{ steps.trigger.outputs.job_id }}"
          HOOK_URL="${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          # Extract base URL from hook to build the status endpoint
          # Deploy hooks return a job state via the same token domain
          echo "Polling Vercel deployment status for job: $JOB_ID"
          MAX_WAIT=360  # 6 minutes
          INTERVAL=10
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            # Poll the Vercel deployment via the token embedded in the hook URL
            STATUS_RESPONSE=$(curl -s -X GET \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v13/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=1&target=production" \
              2>/dev/null || echo "{}")

            STATE=$(echo "$STATUS_RESPONSE" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            deps = d.get('deployments', [])
            if deps:
              print(deps[0].get('state', 'UNKNOWN'))
            else:
              print('NONE')
          except:
            print('ERROR')
          " 2>/dev/null || echo "PARSE_ERROR")

            URL=$(echo "$STATUS_RESPONSE" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            deps = d.get('deployments', [])
            if deps:
              print(deps[0].get('url', ''))
          except:
            pass
          " 2>/dev/null || echo "")

            echo "[$ELAPSED s] State: $STATE"

            case "$STATE" in
              READY)
                echo ""
                echo "✅ Deployment READY: https://$URL"
                exit 0
                ;;
              ERROR)
                echo ""
                echo "❌ Deployment FAILED — check https://vercel.com/dashboard"
                exit 1
                ;;
              CANCELED)
                echo "⚠️  Deployment CANCELED"
                exit 1
                ;;
              QUEUED|BUILDING|INITIALIZING)
                # Still in progress — keep polling
                ;;
              NONE)
                echo "No deployments found yet, retrying..."
                ;;
              *)
                echo "Unknown state: $STATE"
                ;;
            esac
          done

          echo "⏱️  Timed out after ${MAX_WAIT}s waiting for deployment"
          exit 1
