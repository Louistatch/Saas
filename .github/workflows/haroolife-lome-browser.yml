name: HarooLife Lomé Local Browser QA

on:
  pull_request:
    paths:
      - 'components/haroolife/**'
      - 'lib/haroolife/**'
      - 'app/haroolife/**'
      - 'app/api/haroolife/**'
      - 'e2e/lome-*'
      - 'e2e/fixtures/**'
      - '.github/workflows/haroolife-lome-browser.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgl-browser:
    name: webgl-browser (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The Chrome suite (desktop + Android, ~214 tests in software WebGL, ~100 min on one worker)
    # is split into eight shards that run side by side, each with its own Supabase stand-in,
    # relay and Next server: no test waits longer than before, the work is only shared out.
    # Firefox runs the entry spec, written for its navigation bars.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'chrome 1/8', browser: chromium, args: '--project=desktop --project=mobile-android --shard=1/8' }
          - { name: 'chrome 2/8', browser: chromium, args: '--project=desktop --project=mobile-android --shard=2/8' }
          - { name: 'chrome 3/8', browser: chromium, args: '--project=desktop --project=mobile-android --shard=3/8' }
          - { name: 'chrome 4/8', browser: chromium, args: '--project=desktop --project=mobile-android --shard=4/8' }
          - { name: 'chrome 5/8', browser: chromium, args: '--project=desktop --project=mobile-android --shard=5/8' }
          - { name: 'chrome 6/8', browser: chromium, args: '--project=desktop --project=mobile-android --shard=6/8' }
          - { name: 'chrome 7/8', browser: chromium, args: '--project=desktop --project=mobile-android --shard=7/8' }
          - { name: 'chrome 8/8', browser: chromium, args: '--project=desktop --project=mobile-android --shard=8/8' }
          - { name: 'firefox entry', browser: firefox, args: '--project=firefox-mobile e2e/lome-entry.spec.ts' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate the active city pack and supplied models
        run: npm run test:haroolife-map
      - name: Install the local browser with headless WebGL drivers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start the local Supabase stand-in (fixtures only, no real backend)
        run: |
          node e2e/fixtures/mock-supabase.mjs > mock-supabase.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:54329/__reset && break
            sleep 1
          done
      - name: Start the local Socket.IO relay (real chat migration in PGlite, fixtures only)
        env:
          SUPABASE_URL: http://127.0.0.1:54329
          SUPABASE_ANON_KEY: e2e-anon-key
          HAROOLIFE_REALTIME_REPO: pglite
        run: |
          npm run realtime > realtime.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3001/health && break
            sleep 1
          done
      - name: Verify desktop and Android-sized browser locally (NO deployment)
        # Dummy values pointing at the stand-in above; nothing leaves the runner.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          SUPABASE_SERVICE_ROLE_KEY: e2e-service
          HAROOLIFE_ENABLED: 'true'
          NEXT_PUBLIC_HAROOLIFE_ENABLED: 'true'
          NEXT_PUBLIC_HAROOLIFE_REALTIME_URL: http://127.0.0.1:3001
        run: npx playwright test --config=e2e/lome-life-playwright.config.ts ${{ matrix.args }}
      - name: Name the artifact after the shard
        if: always()
        run: echo "ARTIFACT=haroolife-lome-visual-qa-$(echo '${{ matrix.name }}' | tr ' /' '--')" >> "$GITHUB_ENV"
      - name: Keep desktop/mobile screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            test-results/lome-visual
            test-results/lome-report
            test-results/lome-cooperative
            test-results/lome-city
            test-results/lome-perf
            test-results/**/*.zip
            test-results/**/error-context.md
            mock-supabase.log
            realtime.log
          retention-days: 7
